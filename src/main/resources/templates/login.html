<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login — Leave Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background: linear-gradient(135deg,#1e3a5f,#0d6efd); min-height:100vh; display:flex; align-items:center; }
        .login-card { border-radius:20px; border:none; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .btn-login { background:linear-gradient(135deg,#0d6efd,#0b5ed7); border:none; padding:12px; font-size:1.1rem; border-radius:10px; }
        .form-control { border-radius:10px; padding:12px 16px; border:2px solid #e9ecef; }
        .form-control:focus { border-color:#0d6efd; box-shadow:none; }
        .alert-custom { border-radius:10px; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill text-primary" style="font-size:3rem;"></i>
                    <h2 class="fw-bold mt-2">Welcome Back</h2>
                    <p class="text-muted">Sign in to your account</p>
                </div>

                <!-- Error Message -->
                <div th:if="${param.error}" class="alert alert-danger alert-custom">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>Invalid username or password.
                </div>

                <!-- Logout Message -->
                <div th:if="${param.logout}" class="alert alert-success alert-custom">
                    <i class="bi bi-check-circle-fill me-2"></i>You have been logged out successfully.
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Enter username" required/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Enter password" required/>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login btn-primary w-100 text-white fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="/" class="text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
