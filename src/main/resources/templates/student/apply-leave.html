<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Apply Leave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#f0f4f8; }
        .card { border:none; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.08); }
        .header-bar { background:linear-gradient(135deg,#fdcb6e,#e17055); }
        .form-label { font-weight:600; color:#495057; }
        .form-control, .form-select { border-radius:10px; border:2px solid #e9ecef; padding:10px 14px; }
        .form-control:focus, .form-select:focus { border-color:#e17055; box-shadow:none; }
        .btn-submit { background:linear-gradient(135deg,#fdcb6e,#e17055); border:none; padding:12px 40px; font-size:1.1rem; border-radius:10px; }
    </style>
</head>
<body>
<div class="header-bar text-white px-4 py-3 d-flex align-items-center justify-content-between">
    <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Apply for Leave</h4>
    <a href="/student/dashboard" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>
</div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Student Info (Read-only) -->
            <div class="card p-4 mb-4 bg-light">
                <h6 class="fw-bold text-muted mb-3">STUDENT INFORMATION</h6>
                <div class="row">
                    <div class="col-md-4">
                        <small class="text-muted">Name</small>
                        <p class="fw-semibold mb-0" th:text="${student.name}">Name</p>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">Register Number</small>
                        <p class="fw-semibold mb-0" th:text="${student.regNo}">Reg No</p>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">Section</small>
                        <p class="fw-semibold mb-0" th:text="${student.section}">Section</p>
                    </div>
                    <div class="col-md-4 mt-2">
                        <small class="text-muted">Parent Name</small>
                        <p class="fw-semibold mb-0" th:text="${student.parentName}">Parent</p>
                    </div>
                    <div class="col-md-4 mt-2">
                        <small class="text-muted">Parent Mobile</small>
                        <p class="fw-semibold mb-0" th:text="${student.parentMobile}">Mobile</p>
                    </div>
                    <div class="col-md-4 mt-2">
                        <small class="text-muted">Tutor</small>
                        <p class="fw-semibold mb-0" th:text="${student.tutor.name}">Tutor</p>
                    </div>
                </div>
            </div>

            <!-- Leave Form -->
            <div class="card p-4">
                <h5 class="fw-bold mb-4"><i class="bi bi-calendar-event me-2"></i>Leave Details</h5>
                <form th:action="@{/student/apply-leave}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Leave Type</label>
                            <select name="leaveType" class="form-select" required>
                                <option value="">Select Leave Type</option>
                                <option value="Medical">Medical</option>
                                <option value="Personal">Personal</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Reason for Leave</label>
                            <input type="text" name="reason" class="form-control"
                                   placeholder="Enter reason" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">From Date</label>
                            <input type="date" name="fromDate" id="fromDate"
                                   class="form-control" required onchange="calcDays()"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">To Date</label>
                            <input type="date" name="toDate" id="toDate"
                                   class="form-control" required onchange="calcDays()"/>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Total Days</label>
                            <input type="text" id="totalDaysDisplay" class="form-control bg-light"
                                   placeholder="Will be calculated automatically" readonly/>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Address / Remarks</label>
                            <textarea name="address" class="form-control" rows="3"
                                      placeholder="Enter your address or additional remarks"></textarea>
                        </div>
                        <div class="col-12 text-center mt-2">
                            <button type="submit" class="btn btn-submit text-white fw-bold">
                                <i class="bi bi-send-fill me-2"></i>Submit Leave Request
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function calcDays() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        if (from && to) {
            const diff = (new Date(to) - new Date(from)) / (1000 * 60 * 60 * 24) + 1;
            document.getElementById('totalDaysDisplay').value =
                diff > 0 ? diff + ' day(s)' : 'Invalid date range';
        }
    }
</script>
</body>
</html>
