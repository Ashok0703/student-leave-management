<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#f0f4f8; }
        .navbar-custom { background:linear-gradient(135deg,#fdcb6e,#e17055); }
        .card { border:none; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.08); }
        .profile-card { background:linear-gradient(135deg,#fdcb6e,#e17055); color:white; }
    </style>
</head>
<body>
<nav class="navbar navbar-custom navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">
        <i class="bi bi-person-circle me-2"></i>Student Dashboard
    </span>
    <div class="d-flex gap-2">
        <a href="/student/apply-leave" class="btn btn-light btn-sm fw-semibold">
            <i class="bi bi-plus-circle me-1"></i>Apply Leave
        </a>
        <a href="/logout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container py-4">
    <!-- Profile -->
    <div class="card profile-card p-4 mb-4">
        <div class="row align-items-center">
            <div class="col-auto">
                <i class="bi bi-person-circle" style="font-size:4rem;"></i>
            </div>
            <div class="col">
                <h3 class="fw-bold mb-1" th:text="${student.name}">Student Name</h3>
                <p class="mb-0 opacity-90">
                    <span th:text="'Reg No: ' + ${student.regNo}"></span> |
                    <span th:text="'Section: ' + ${student.section}"></span> |
                    <span th:text="'Tutor: ' + ${student.tutor.name}"></span> |
                    <span th:text="'Dept: ' + ${student.tutor.hod.department}"></span>
                </p>
            </div>
            <div class="col-auto">
                <a href="/student/apply-leave" class="btn btn-light btn-lg fw-bold px-4">
                    <i class="bi bi-plus-circle-fill me-2"></i>Apply for Leave
                </a>
            </div>
        </div>
    </div>

    <!-- Leave History -->
    <div class="card p-4">
        <h5 class="fw-bold mb-4"><i class="bi bi-journal-text me-2"></i>My Leave History</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th><th>Applied</th><th>Type</th><th>Reason</th>
                    <th>From</th><th>To</th><th>Days</th>
                    <th>Tutor</th><th>HOD</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="leave, stat : ${leaveHistory}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${leave.appliedDate}"></td>
                    <td><span class="badge bg-info" th:text="${leave.leaveType}"></span></td>
                    <td th:text="${leave.reason}"></td>
                    <td th:text="${leave.fromDate}"></td>
                    <td th:text="${leave.toDate}"></td>
                    <td th:text="${leave.totalDays}"></td>
                    <td>
                            <span th:class="'badge ' + (${leave.tutorStatus.name() == 'APPROVED'} ? 'bg-success' : (${leave.tutorStatus.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark'))"
                                  th:text="${leave.tutorStatus}"></span>
                    </td>
                    <td>
                            <span th:if="${leave.hodStatus != null}"
                                  th:class="'badge ' + (${leave.hodStatus.name() == 'APPROVED'} ? 'bg-success' : 'bg-danger')"
                                  th:text="${leave.hodStatus}"></span>
                        <span th:if="${leave.hodStatus == null && leave.tutorStatus.name() == 'APPROVED'}"
                              class="badge bg-warning text-dark">Awaiting HOD</span>
                        <span th:if="${leave.hodStatus == null && leave.tutorStatus.name() != 'APPROVED'}"
                              class="badge bg-secondary">—</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(leaveHistory)}">
                    <td colspan="9" class="text-center text-muted py-4">
                        <i class="bi bi-journal-x fs-2 d-block mb-2"></i>
                        No leave requests yet. <a href="/student/apply-leave">Apply now</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
