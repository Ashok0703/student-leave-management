<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background: linear-gradient(135deg, #1e3a5f 0%, #0d6efd 100%); min-height: 100vh; }
        .role-card { transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; border: none; border-radius: 16px; }
        .role-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .role-icon { font-size: 3rem; }
        .card-admin { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
        .card-hod   { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }
        .card-tutor { background: linear-gradient(135deg, #55efc4, #00b894); color: white; }
        .card-student { background: linear-gradient(135deg, #fdcb6e, #e17055); color: white; }
        .header-title { font-size: 2.5rem; font-weight: 700; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header-sub { color: rgba(255,255,255,0.85); font-size: 1.1rem; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-5">
        <i class="bi bi-mortarboard-fill text-white" style="font-size:3rem;"></i>
        <h1 class="header-title mt-2">Student Leave Management System</h1>
        <p class="header-sub">Select your role to continue</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-5 col-lg-3">
            <a href="/login" class="text-decoration-none">
                <div class="card role-card card-admin p-4 text-center">
                    <div class="role-icon mb-3"><i class="bi bi-shield-lock-fill"></i></div>
                    <h3 class="fw-bold">Admin</h3>
                    <p class="mb-0 opacity-75">Manage HOD Accounts</p>
                </div>
            </a>
        </div>
        <div class="col-md-5 col-lg-3">
            <a href="/login" class="text-decoration-none">
                <div class="card role-card card-hod p-4 text-center">
                    <div class="role-icon mb-3"><i class="bi bi-person-workspace"></i></div>
                    <h3 class="fw-bold">HOD</h3>
                    <p class="mb-0 opacity-75">Department Head Portal</p>
                </div>
            </a>
        </div>
        <div class="col-md-5 col-lg-3">
            <a href="/login" class="text-decoration-none">
                <div class="card role-card card-tutor p-4 text-center">
                    <div class="role-icon mb-3"><i class="bi bi-person-badge-fill"></i></div>
                    <h3 class="fw-bold">Tutor</h3>
                    <p class="mb-0 opacity-75">Manage Your Students</p>
                </div>
            </a>
        </div>
        <div class="col-md-5 col-lg-3">
            <a href="/login" class="text-decoration-none">
                <div class="card role-card card-student p-4 text-center">
                    <div class="role-icon mb-3"><i class="bi bi-person-circle"></i></div>
                    <h3 class="fw-bold">Student</h3>
                    <p class="mb-0 opacity-75">Apply & Track Leave</p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
